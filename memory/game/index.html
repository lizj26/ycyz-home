<body>

  <div id="stage"><canvas id="game" width="840" height="1280" style="width: 420px; height: 640px;"></canvas></div>

<script>
(function(){
'use strict';

/* ---------- 基础 ---------- */
const W=420, H=640;
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

/* ---------- 高清渲染 ---------- */
let R=0;
const skyCache={t:-1,g:null};   // 天空渐变缓存: 夜色不变时不必每帧重建(画布重建后置空)
function applyResolution(){
  const dpr=Math.max(1, Math.min(2.5, (window.devicePixelRatio||1)));   // 上限2.5: 保清晰且省帧
  const pw=Math.round(W*dpr), ph=Math.round(H*dpr);
  if(R===dpr && canvas.width===pw && canvas.height===ph) return;   // 尺寸没变就跳过: 重设画布会清屏并重置上下文
  R=dpr;
  canvas.width=pw;
  canvas.height=ph;
  ctx.setTransform(R,0,0,R,0,0);
  skyCache.g=null;
}

/* 自适应缩放: 精确适配手机/电脑, 绝不缩小过度 */
const stage=document.getElementById('stage');
function fit(){
  const s=Math.min(window.innerWidth/W, window.innerHeight/H)*0.985;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  stage.style.transform='scale('+s+')';
}
/* resize / orientationchange 会连续触发, 合并到一帧处理, 避免反复重建画布 */
let layoutPending=false;
function relayout(){
  if(layoutPending) return;
  layoutPending=true;
  requestAnimationFrame(function(){ layoutPending=false; fit(); applyResolution(); });
}
window.addEventListener('resize',relayout);
window.addEventListener('orientationchange',function(){ setTimeout(relayout,120); });
fit(); applyResolution();

/* 校徽图片 / 玩家头像球 / 背景图片 */
const logo=new Image();
logo.src='xiaoqing.png';
const avatar=new Image();
avatar.src='banhui.png';

/* 两张背景图（书雕 / 校园夜色）共约 155KB。不在解析期就要，等首帧和菜单出来
   再加载：drawBackGround() 在图片没加载完时直接返回，图到了会自己淡入，
   所以先看到的是天空和远山，随后景物浮现——比原来白等 1MB 更顺。 */
const featureDay=new Image();
const featureNight=new Image();
function loadFeatureArt(){
  if(featureDay.src) return;
  featureDay.src='feature_day.webp';
  featureNight.src='feature_night.webp';
}
addEventListener('load', function(){
  if('requestIdleCallback' in window) requestIdleCallback(loadFeatureArt,{timeout:2000});
  else setTimeout(loadFeatureArt, 400);
});
//玩家头像球
function ballImage(){
  if(avatar.complete && avatar.naturalWidth>0) return avatar;
  return logo;
}

/* ---------- 常量 ---------- */
const GRAVITY=800;                          // 重力加速度
const FLAP_BASE=240, MAX_FALL=840;          // 起跳速度 / 最大下落速度
const GROUND_H=90, GROUND_Y=H-GROUND_H;
const BX=126, R_BIRD=28;                    // 校徽球水平位置 / 视觉半径
const HIT_R=26;                             // 判定半径 = 视觉半径的 9/10 (更宽容一点)
const PIPE_W=68, PIPE_GAP0=226, PIPE_GAP_MIN=10, PIPE_SPEED0=110, PIPE_SPEED_MAX=240;
const PIPE_SPACING=240;                     // 柱子间距
const DAY_LENGTH=5;                         // 白日长度, 昼夜交替周期 = DAY_LENGTH*2
const NIGHT_FADE_SPEED=0.8;                 // 昼夜渐变速度(每秒)
const EGG_SCORE=120;                        // 彩蛋阈值
const VICTORY_SCORE=120;                    // 百廿通关分数
const NOTICE_DURATION=3;                    // 提示文字停留秒数
// 从外部加载数据，计算最大有效索引
const MAX_THU_INDEX = (typeof thuData !== 'undefined' && thuData) ? thuData.length - 1 : -1;
const MAX_XINYA_INDEX = (typeof xinyaData !== 'undefined' && xinyaData) ? xinyaData.length - 1 : -1;
const XINYA_TRANSITION_DURATION = 4;    // 显示时长（秒）
const XINYA_TRANSITION_MSG = '🎉 锐意其新  茹涵其雅\n道阻且长殊未怯\n但守初心作北辰\n接下来继续飞翔吧！';

/* ---------- 状态 ---------- */
let state='menu';                 // menu | play | over
let paused = false;               // 暂停标志
let birdY=300, vy=0, angle=0, bob=0;
let score=0, flash=0;
let pipes=[], dist=0, groundX=0;
let clouds=[], parts=[];
let deadT=0, newBest=false, muted=false;
let night=false, nightAmt=0;      // 夜间开关 / 渐变进度(仅背景变化, 无字幕无弹窗)
let eggActive=false;              // 彩蛋是否已点亮(点亮后本局一直显示)
let eggPending=true;              // 彩蛋是否还没拿到
let pipeIndex=0;                  // 已生成的柱子数量(从0开始)
let mode='thu';                   // 'thu' 清华人会飞 | 'xinya' 新雅人会飞
let bestThu=+(localStorage.getItem('thu_best')||0);
let bestXy=+(localStorage.getItem('xinya_best')||0);
let best=bestThu, history=[];
let notification=null;            // 当前显示的提示文字 { text, timer }
let xinyaTransition=false;        // 是否处于过渡状态
let xinyaTransitionTimer=0;       // 过渡计时器

/* 成绩分模式各存一份, key 由当前模式决定 */
function histKey(){ return mode==='xinya' ? 'xinya_hist' : 'thu_hist'; }
function bestKey(){ return mode==='xinya' ? 'xinya_best' : 'thu_best'; }
function readHistory(key){
  try{ const h=JSON.parse(localStorage.getItem(key)||'[]'); return Array.isArray(h)?h:[]; }
  catch(e){ return []; }
}
function applyMode(m){
  mode=(m==='xinya') ? 'xinya' : 'thu';
  best= mode==='xinya' ? bestXy : bestThu;
  history=readHistory(histKey());
}
function modeTitle(){ return mode==='xinya' ? '2班人会飞' : '一中人会飞'; }
history=readHistory(histKey());
/* 音乐开关与地图主页共用一份偏好（localStorage: bgm_on）：
   1 = 开、0 = 关；读不到时回退到游戏自己的 thu_mute 键 */
(function(){
  var shared = localStorage.getItem('bgm_on');
  if (shared === '0') muted = true;
  else if (shared === '1') muted = false;
  else if (localStorage.getItem('thu_mute') === '1') muted = true;
})();

/* 星星(夜间) */
let stars=[];
(function(){ for(let i=0;i<80;i++){ stars.push({x:Math.random()*W, y:Math.random()*GROUND_Y*.62, r:.6+Math.random()*1.5, ph:Math.random()*7}); } })();

/* ---------- 音频 ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }

/* ---------- 多曲背景音乐系统（手动选择 + 循环播放） ---------- */
// 1. 配置你的音乐列表（文件名按实际修改）
const bgmTracks = ['xiaoge_converted_audio.mp3', 'xiaoge_haofengyangfan_converted_audio.mp3', 'xiaoge_feixiang_converted_audio.mp3'];
// 2. 给每首歌起个显示名称（方便菜单展示）
const bgmNames = ['向着太阳出发', '好风扬帆', '飞翔']; 
const BGM_BAR_Y = 440;                                   // 菜单里音乐按钮的 Y 坐标
function bgmButtonRect(i){ return { x:W/2-62+i*74, y:BGM_BAR_Y, w:70, h:26 }; }   // 绘制与点击共用同一份几何

/* 站点 BGM 里还有第 4 首「夜空中最亮的星」（assets/bgm.js），小游戏里选不到：
   进来时如果正在放它，就接着放，同时三个歌名按钮都不高亮（selectedBgmIndex = -1）。 */
const SITE_STAR_BGM = 'Star_converted_audio.mp3';
const SITE_STAR_INDEX = 3;                       // 与 assets/bgm.js 里 bgm_track 的取值一致

/* 当前选中曲目：优先沿用地图主页里选过的同一首（localStorage: bgm_track，与主页共用） */
let selectedBgmIndex = (function(){
  const v = parseInt(localStorage.getItem('bgm_track'), 10);
  if (v === SITE_STAR_INDEX) return -1;             // 站点在放「夜空中最亮的星」→ 三首都不选
  return (v >= 0 && v < bgmTracks.length) ? v : 0;  // 没选过或索引越界 → 第一首
})();
const XINYA_SPECIAL_BGM = SITE_STAR_BGM;
const XINYA_MUSIC_SWITCH_INDEX = MAX_XINYA_INDEX-15;            // 通过n柱子时切换
let xinyaMusicSwitched = false;                  // 是否已切换到特殊音乐
const bgm = new Audio();
bgm.volume = 0.3;                  // 音量 0~1

/* ---------- 从上一页接着放 ----------
   assets/bgm.js 在离开页面时把 { i: 第几首, t: 播到第几秒, playing, d } 写进
   sessionStorage.bgm_pos；这里读回来，进小游戏时就能接着放，而不是从头开始。 */
const bgmResume = (function(){
  try {
    const p = JSON.parse(sessionStorage.getItem('bgm_pos') || 'null');
    if (!p || !p.playing) return null;
    if (Date.now() - (p.d || 0) > 30*60*1000) return null;   // 超过半小时就不续了
    return p;
  } catch(e){ return null; }
})();
/* 这一首的续播位置；不是同一首就返回 0 */
function resumePosFor(i){
  if (!bgmResume || bgmResume.i !== i) return 0;
  return bgmResume.t > 0.5 ? bgmResume.t : 0;
}
/* 元数据到手后才能写 currentTime */
function seekBgm(t){
  if (!(t > 0)) return;
  var once = function(){
    bgm.removeEventListener('loadedmetadata', once);
    try { bgm.currentTime = Math.max(0, Math.min(t, (bgm.duration || t) - 0.3)); } catch(e){}
  };
  bgm.addEventListener('loadedmetadata', once);
}

// 核心播放函数：读取当前选中的索引，循环播放
function playBGM() {
    if (selectedBgmIndex < 0) { playStarBGM(); return; }   // 站点在放「夜空中最亮的星」→ 接着放这首
    if (!bgmTracks.length) return;
    if (selectedBgmIndex >= bgmTracks.length) selectedBgmIndex = 0;  // 防止索引越界
    playSelectedBGM();
}

/* 播放站点那首「夜空中最亮的星」（小游戏里选不到，但进来时如果正在放就接着放） */
function playStarBGM() {
  if (muted) return;
  /* 同一首已经挂上就别重设 src —— 重设会把播放位置清零 */
  if (bgm.src.indexOf(SITE_STAR_BGM) < 0) {
    bgm.src = SITE_STAR_BGM;
    bgm.loop = true;
    seekBgm(resumePosFor(SITE_STAR_INDEX));
  }
  bgm.play().catch(function () { });
}
function stopBGM() {
    bgm.pause();
    /* 不归零：这一局结束时停在哪儿，下一局就从哪儿接着放（跨局连续）。
       想恢复「每局从头播」，把下面一行注释掉的那句放回来即可。 */
    // bgm.currentTime = 0;
    // 【注意】不重置 selectedBgmIndex，保留用户选择
}
function playSpecialBGM() {
  if (muted) return;
  bgm.pause();
  bgm.src = XINYA_SPECIAL_BGM;
  bgm.loop = true;
  bgm.play().catch(() => {});
}

//音效
function tone(f0,f1,dur,type,vol){            
  if(muted) return; const a=ac(); if(!a) return;
  const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol||.15,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function sfxFlap(){ tone(300,640,.13,'triangle',.11); }
function sfxPoint(){ tone(880,880,.08,'sine',.12); setTimeout(function(){tone(1318,1318,.15,'sine',.10);},70); }
function sfxHit(){ tone(210,55,.38,'sawtooth',.20); }
function sfxNew(){ [660,880,1108,1318].forEach(function(f,i){ setTimeout(function(){tone(f,f,.18,'triangle',.12);},i*90); }); }

/* ---------- 音效与暂停按钮 ---------- */
const muteRect={x:W-48,y:10,w:38,h:38};
const pauseRect = { x: 10, y: 10, w: 38, h: 38 };   // 左上角

/* ---------- 难度: 间隙有下限, 速度有上限 ---------- */
function pipeGap(){ return Math.max(PIPE_GAP_MIN, PIPE_GAP0 - 8*Math.floor(score/4)); }
function pipeSpeed(){ return Math.min(PIPE_SPEED_MAX, PIPE_SPEED0 + score*4.2); }

/* ---------- 柱子 ---------- */
const PIPE_MARGIN=88, PIPE_SPAWN_X=W+50;
// 按当前模式取出第 index 根柱子要显示的数据(年份 / 日期 / 提示语)
function pipeDataAt(index){
  if(mode==='thu'){
    const item=(index>=0 && index<=MAX_THU_INDEX) ? thuData[index] : null;
    return { year:item?item.year:null, dateData:null, msg:item?item.msg||null:null, isFirst:index===0 };
  }
  const item=(index>=0 && index<=MAX_XINYA_INDEX) ? xinyaData[index] : null;
  return { year:null, dateData:item?item.date:null, msg:item?item.msg||null:null, isFirst:false };
}
// 造一根柱子: 随机高度 + 该位置对应的校史数据, 每造一根 pipeIndex 前进一格
function makePipe(x){
  const gap=pipeGap();
  const d=pipeDataAt(pipeIndex);
  const cy=PIPE_MARGIN+gap/2+Math.random()*(GROUND_Y-gap-2*PIPE_MARGIN);
  const p={
    x:x, cy:cy, gap:gap, speed:pipeSpeed(), passed:false, index:pipeIndex,
    year:d.year, dateData:d.dateData, msg:d.msg, isFirst:d.isFirst
  };
  pipeIndex++;
  return p;
}
function spawnPipe(){ pipes.push(makePipe(PIPE_SPAWN_X)); }
function resetPipes(){
  pipes=[]; pipeIndex=0;
  for(let i=0;i<3;i++) pipes.push(makePipe(PIPE_SPAWN_X+i*PIPE_SPACING));
}

/* ---------- 粒子 ---------- */
function burst(x,y,n,cols){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=50+Math.random()*260;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,life:.35+Math.random()*.4,t:0,
                r:1.5+Math.random()*3, col:cols[i%cols.length]});
  }
}

/* ---------- 工具 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function text(str,x,y,size,color,align,bold){
  ctx.font=(bold?'700 ':'600 ')+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.fillStyle=color; ctx.fillText(str,x,y);
}
function outlineText(str,x,y,size,color,line,align,bold){
  ctx.font=(bold?'800 ':'700 ')+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,size/8); ctx.strokeStyle=line; ctx.lineJoin='round';
  ctx.strokeText(str,x,y); ctx.fillStyle=color; ctx.fillText(str,x,y);
}

/* ---------- 游戏控制 ---------- */
function flap(){ vy=-FLAP_BASE; sfxFlap(); }
function showNotice(msg,dur){
  if(!msg) return;
  notification={ text:msg, timer:dur||NOTICE_DURATION };
}
function startGame(m){
  applyMode(m);
  score=0; birdY=300; vy=0; angle=0; flash=0; newBest=false; bob=0;
  night=false; nightAmt=0; eggActive=false; eggPending=true;
  paused=false; xinyaTransition=false; xinyaMusicSwitched=false;
  resetPipes(); parts=[]; state='play'; deadT=0; notification=null;
  // 教师节专属祝福（仅9月10日显示）
  const today=new Date();
  if(today.getMonth()===8 && today.getDate()===10){
    showNotice('教师节快乐！\n感谢恩师教导\n您辛苦了！');
  }
  playBGM();
}
function gameOver(){
  state='over'; deadT=0; sfxHit();
  burst(BX,birdY,24,['#F6BB60','#ffffff','#d9a6f2']);
  try{
    history.unshift({s:score,t:Date.now()}); history=history.slice(0,8);
    localStorage.setItem(histKey(), JSON.stringify(history));
    if(score>best){
      best=score; newBest=true;
      if(mode==='xinya') bestXy=score; else bestThu=score;
      localStorage.setItem(bestKey(), best);
      setTimeout(sfxNew,150);
    }
  }catch(e){}
  notification=null;
  stopBGM();
}
function victory(){
  state = 'victory';
  // 播放胜利音效（可用 sfxNew 或自定义）
  sfxNew(); // 或定义 sfxVictory
  // 大量庆祝粒子
  for (let k = 0; k < 6; k++) {
    setTimeout(function() {
      burst(60 + Math.random()*300, 80 + Math.random()*200, 30,
            ['#FFD700','#FF6B6B','#4ECDC4','#FFE66D','#A8E6CF','#FF8A5C']);
    }, k * 120);
  }
  notification = null;
  stopBGM();
}

/* ---------- 输入 ---------- */
const cardThu={x:60,y:70,w:300,h:128};
const cardXy ={x:60,y:216,w:300,h:128};
function inRect(x,y,r){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }
function cardAt(x,y){
  if(inRect(x,y,cardThu)) return 'thu';
  if(inRect(x,y,cardXy)) return 'xinya';
  return null;
}
function toggleMute(){
  muted=!muted;
  // 两个键都写：thu_mute 保留旧兼容，bgm_on 与地图主页共享
  localStorage.setItem('thu_mute', muted?'1':'0');
  localStorage.setItem('bgm_on', muted?'0':'1');
  if(muted) bgm.pause();                        // 静音 → 暂停音乐
  else bgm.play().catch(()=>{});                // 取消静音：接着放（没挂 src 时会被拒绝，忽略即可）
}
function playSelectedBGM(){
  if(muted) return;
  var want = bgmTracks[selectedBgmIndex];
  /* 同一首已经挂上就别重设 src —— 重设会把播放位置清零，切页面过来就接不上了 */
  if (bgm.src.indexOf(want) < 0) {
    bgm.src = want;
    bgm.loop = true;
    seekBgm(resumePosFor(selectedBgmIndex));
  }
  bgm.play().catch(()=>{});
}
function handleDown(x,y){
  // 1. 静音按钮(任何状态都能点)
  if(inRect(x,y,muteRect)){ toggleMute(); return; }
  // 2. 暂停按钮(仅游戏中)
  if(state==='play' && !xinyaTransition && inRect(x,y,pauseRect)){ paused=!paused; return; }
  // 3. 菜单: 模式卡片 / 音乐按钮
  if(state==='menu'){
    const m=cardAt(x,y);
    if(m){ startGame(m); return; }
    for(let i=0;i<bgmTracks.length;i++){
      if(inRect(x,y,bgmButtonRect(i))){
        selectedBgmIndex=i;
        localStorage.setItem('bgm_track', String(i));   // 与地图主页共用同一份选择
        playSelectedBGM();
        return;
      }
    }
    return;   // 菜单空白处无反应
  }
  // 4. 飞行中: 点哪儿都是起飞(过渡黑屏期间不响应)
  if(state==='play'){ if(!xinyaTransition) flap(); return; }
  if(state==='over'){
    if(deadT<=0.55) return;
    const sy=overMenuButtonY();   // 「换个模式」小按钮
    if(x>=W/2-95 && x<=W/2+95 && y>=sy && y<=sy+22){ state='menu'; return; }
    startGame(mode);              // 再飞一次(同模式)
    return;
  }
  if(state==='victory') state='menu';
}
function overMenuButtonY(){ return newBest ? 418 : 384; }

if (!muted && bgmResume) {

    if (!muted && bgm.paused) playBGM();

/* ---------- 物理(250Hz 子步) ---------- */
let last=performance.now(), acc=0;
const STEP=1/240;
function tick(dt){
  if (paused) return;
  // 处理过渡状态（黑屏计时）
  if (xinyaTransition) {
    xinyaTransitionTimer -= dt;
    if (xinyaTransitionTimer <= 0) {
      xinyaTransition = false;
    }
    return;   // 过渡期间暂停所有物理更新
  }
  // 更新通知
  if (notification) {
    notification.timer -= dt;
    if (notification.timer <= 0) {
      notification = null;
    }
  }
  if(state==='play'){
    vy=Math.min(MAX_FALL, vy+GRAVITY*dt);
    birdY+=vy*dt;
    if(birdY-R_BIRD<2){ birdY=R_BIRD+2; if(vy<0)vy*=-0.35; }
    const sp=pipeSpeed();
    for(let i=0;i<pipes.length;i++){
      const p=pipes[i];
      p.x-=p.speed*dt;
      if(p.passed || p.x+PIPE_W>=BX-HIT_R) continue;   // 还没穿过这根柱子
      p.passed=true;
      showNotice(p.msg);                               // 柱子上的校史提示(没有则忽略)
      if(p.isFirst) continue;                          // 第一根柱子只提示, 不计分

        // ---------- 正常计分逻辑（仅非第一个柱子执行） ----------
        score++;
        flash=1;
        sfxPoint();
        burst(BX-4,birdY-R_BIRD-6,9,['#F6BB60','#ffffff']);

        // ★ 检测2班模式预设数据是否全部显示完毕
        // 穿过最后一根「有数据」的柱子（序号 = MAX_XINYA_INDEX）就收尾，
        // 否则还会多飞一根没有日期的空白柱子才黑屏。
        if (mode === 'xinya' && score === MAX_XINYA_INDEX && !xinyaTransition) {
          xinyaTransition = true;
          xinyaTransitionTimer = XINYA_TRANSITION_DURATION;
          // 立即退出本次tick，不执行后续逻辑（音效、粒子等）
          return;
        }

        // 昼夜交替: 每 DAY_LENGTH*2 根柱子一轮, 彩蛋之后一直是白天
        night = (score % (DAY_LENGTH*2) >= DAY_LENGTH && score <= EGG_SCORE);

        // 彩蛋判定(每局最多点亮一次)
        if(score >= EGG_SCORE && eggPending){ eggActive = true; eggPending = false; }

        // 胜利判定（百廿模式）
        if (mode === 'thu' && score >= VICTORY_SCORE) {
          victory();
          return;
        }
    }
    while(pipes.length && pipes[0].x<-PIPE_W-70) pipes.shift();
    const lastP=pipes[pipes.length-1];
    if(lastP && lastP.x < W-PIPE_SPACING) spawnPipe();
    dist+=sp*dt; groundX=dist;
    // 上升时喷出的金色尾迹
    if(vy<-120 && Math.random()<0.2){
      parts.push({x:BX+6+Math.random()*10-R_BIRD/2,y:birdY+R_BIRD*.42,
                  vx:-50-Math.random()*50,vy:40+Math.random()*40,
                  life:.3+Math.random()*.12,t:0,r:1.6+Math.random()*2.2,
                  col:Math.random()<.5?'#F6BB60':'#ffffff'});
    }
    
    // 碰撞: 判定半径≈视觉圆环, 且计入管口盖的加宽(盖沿碰到也算死)
    const by=birdY;
    if(birdY+R_BIRD>=GROUND_Y){ birdY=GROUND_Y-R_BIRD; gameOver(); return; }
    for(let i=0;i<pipes.length;i++){
      const p=pipes[i];
      const xOverlap = BX+HIT_R > p.x-7 && BX-HIT_R < p.x+PIPE_W+7;   // 含盖沿
      if(xOverlap){
        const top=p.cy-p.gap/2, bot=p.cy+p.gap/2;
        if(by-HIT_R<top || by+HIT_R>bot){ gameOver(); return; }
      }  
    }
    
    // 旋转: 清华=随速度翘头/俯冲; 新雅=圆球持续顺时针滚动(与点击/升降无关, 角速度=水平速度/半径)
    if(mode==='xinya'){
      angle += dt*Math.min(9.5, (pipeSpeed()/R_BIRD)*1.35);
    } else {
      const target = vy<0 ? -0.44 : Math.min(1.35,(vy/MAX_FALL)*1.55);
      angle += (target-angle)*Math.min(1, dt*9);
    }
  } else if(state==='over'){
    deadT+=dt;
    vy=Math.min(MAX_FALL, vy+GRAVITY*dt*0.82);
    if(birdY<GROUND_Y-R_BIRD){ birdY+=vy*dt; angle+=dt*6.5; if(angle>1.5)angle=1.5; }
    else { birdY=GROUND_Y-R_BIRD; angle=1.5; }
  } else {
    bob=Math.sin(performance.now()/430)*7;
  }
  
  /* 夜间渐变(纯背景过渡) */
  nightAmt+=(night?1:-1)*dt*NIGHT_FADE_SPEED;
  if(nightAmt<0) nightAmt=0; if(nightAmt>1) nightAmt=1;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>p.life){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=230*dt;
  }
  clouds.forEach(function(c){ c.x-=c.spd*dt; });
  clouds=clouds.filter(function(c){return c.x>-160;});
  if(clouds.length<5&&Math.random()<0.06) clouds.push({x:W+60,y:34+Math.random()*220,s:.6+Math.random()*1.2,a:.45+Math.random()*.4,spd:6+Math.random()*8});
  if(flash>0) flash-=dt*1.5;
}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  acc+=dt;
  while(acc>=STEP){ tick(STEP); acc-=STEP; }
  draw();
  requestAnimationFrame(frame);
}

/* ============ 绘制 ============ */
/* 单一场景渲染: 颜色按 nightAmt 插值, 夜间装饰(星/月/门/辉光)按透明度淡入
   —— 绝不双份绘制, 不用昂贵的 shadowBlur */

function mixc(a,b,i,t){ return Math.round(a[i]+(b[i]-a[i])*t); }
function C3(a,b,t){ return 'rgb('+mixc(a,b,0,t)+','+mixc(a,b,1,t)+','+mixc(a,b,2,t)+')'; }
function C4(a,b,t){ return 'rgba('+mixc(a,b,0,t)+','+mixc(a,b,1,t)+','+mixc(a,b,2,t)+','+(a[3]+(b[3]-a[3])*t).toFixed(3)+')'; }

const SKY_DAY  =[[174,147,226],[206,198,242],[234,228,248],[246,236,216],[247,221,180]];
const SKY_NIGHT=[[7,11,38],[19,27,66],[46,44,94],[78,60,118],[95,70,128]];
const SKY_STOPS=[0,.33,.65,.86,1];
/* 天空渐变只跟夜色有关, 直接复用; 夜色变化超过 0.004 才重建 */
function skyGradient(t){
  if(!skyCache.g || Math.abs(skyCache.t-t)>0.004){
    const g=ctx.createLinearGradient(0,0,0,H);
    for(let i=0;i<SKY_STOPS.length;i++) g.addColorStop(SKY_STOPS[i],C3(SKY_DAY[i],SKY_NIGHT[i],t));
    skyCache.t=t; skyCache.g=g;
  }
  return skyCache.g;
}
function drawSky(){
  const t=nightAmt;
  ctx.fillStyle=skyGradient(t); ctx.fillRect(0,0,W,H);
  // 太阳光晕(白天)→ 减弱
  if(t<1){
    ctx.globalAlpha=1-t;
    let sun=ctx.createRadialGradient(W*.78,120,8,W*.78,120,170);
    sun.addColorStop(0,'rgba(255,240,200,.95)'); sun.addColorStop(.35,'rgba(255,244,220,.5)'); sun.addColorStop(1,'rgba(255,244,220,0)');
    ctx.fillStyle=sun; ctx.fillRect(W*.78-170,120-170,340,340);
    sun=ctx.createRadialGradient(60,60,6,60,60,130);
    sun.addColorStop(0,'rgba(255,255,255,.8)'); sun.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sun; ctx.fillRect(-70,-70,260,260);
    ctx.globalAlpha=1;
  }
  // 远山(颜色随夜变深)
  drawHillsC(dist*0.05,  [122,90,158,.13],[86,66,150,.30], 26,.006);
  drawHillsC(dist*0.12+99,[148,90,170,.10],[72,56,132,.22], 20,.009);
  // 星光(淡入)
  if(t>0.02){
    const tnow=performance.now()/1000;
    ctx.save();
    stars.forEach(function(s){
      const a=(.35+.6*Math.abs(Math.sin(tnow*1.6+s.ph)))*t;
      ctx.globalAlpha=a; ctx.fillStyle=s.r>1.3?'#e8ecff':'#c3c9ff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    });
    ctx.restore(); ctx.globalAlpha=1;
    // 月亮
    ctx.save(); ctx.globalAlpha=t;
    const mx=W*.80, my=96;
    let mg=ctx.createRadialGradient(mx,my,10,mx,my,120);
    mg.addColorStop(0,'rgba(210,220,255,.9)'); mg.addColorStop(.25,'rgba(190,200,255,.35)'); mg.addColorStop(1,'rgba(190,200,255,0)');
    ctx.fillStyle=mg; ctx.fillRect(mx-120,my-120,240,240);
    ctx.fillStyle='#f4f1ff';
    ctx.beginPath(); ctx.arc(mx,my,30,0,7); ctx.fill();
    ctx.fillStyle='rgba(200,205,240,.55)';
    ctx.beginPath(); ctx.arc(mx-9,my-6,6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+8,my+10,4,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+12,my-12,3,0,7); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }
  //彩蛋
  if(eggActive){
    ctx.save();
    ctx.globalAlpha = 1;   // 始终显示
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 36px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#FFD700';
    ctx.fillText('智慧百廿，数字新生', W/2, H/2 - 50);
    // 可选副标题
    ctx.font = 'bold 24px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowBlur = 15;
    ctx.fillText('🎉 120分成就 🎉', W/2, H/2 + 40);
    ctx.restore();
    }
}
function drawHillsC(off,cd,cn,amp,f){
  ctx.fillStyle=C4(cd,cn,nightAmt); ctx.beginPath();
  ctx.moveTo(-10,GROUND_Y+40);
  for(let x=-10;x<=W+10;x+=10){
    const wave=Math.sin((x+off)*f)*amp*.6 + Math.sin((x+off)*f*2.7+2)*amp*.3;
    ctx.lineTo(x, GROUND_Y - H*.24 - wave);
  }
  ctx.lineTo(W+10,GROUND_Y+40);
  ctx.closePath(); ctx.fill();
}

/* --- 绘制背景 --- */
//背景图片
function drawBackGround(){
  const t = nightAmt;
  // 检查图片是否加载
  if (!featureDay.complete || featureDay.naturalWidth === 0) return;
  if (!featureNight.complete || featureNight.naturalWidth === 0) return;

  // 白天图片的位置
  const dayX = W/2 - 200;      // 水平居中
  const dayY = GROUND_Y - 250; // 离地面  px
  const dayW = 400;
  const dayH = 250;

  // 夜晚图片的位置
  const nightX = W/2 - 225;
  const nightY = GROUND_Y - 260; 
  const nightW = 450;
  const nightH = 300;

  ctx.save();

  // 绘制白天图片：透明度从 1 到 0（夜晚加深时淡出）
  ctx.globalAlpha = 1 - t * 1.0;  // t=0 时 alpha=1，t=1 时 alpha=0
  ctx.drawImage(featureDay, dayX, dayY, dayW, dayH);

  // 绘制夜晚图片：透明度从 0 到 1（夜晚加深时淡入）
  ctx.globalAlpha = t * 1.0;      // t=0 时 alpha=0，t=1 时 alpha=1
  ctx.drawImage(featureNight, nightX, nightY, nightW, nightH);

  ctx.restore();
}

/* --- 云 --- */
function drawClouds(){
  const t=nightAmt, col=C3([255,255,255],[124,112,190],t);
  clouds.forEach(function(c){
    ctx.save(); ctx.globalAlpha=c.a*(1-0.35*t);
    ctx.translate(c.x,c.y); const r=c.s*20;
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.ellipse(0,r*.28,r*1.55,r*.55,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(-r*.8,-r*.05,r*.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(-r*.2,-r*.42,r*.78,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(r*.55,-r*.18,r*.68,0,7); ctx.fill();
    ctx.restore();
  });
}

/* --- 管道 --- */
function drawPipes(){
  const t=nightAmt;
  const isThu = (mode === 'thu');
  for(let i=0;i<pipes.length;i++){
    const p=pipes[i], top=p.cy-p.gap/2, bot=p.cy+p.gap/2, capH=30;
    if(p.x>=W || p.x+PIPE_W<-8) continue;   // 完全在画面外的柱子直接跳过, 省掉整套渐变+描边+阴影
    //const D=[[177,123,221],[138,60,192],[106,34,158],[85,24,131]];
    //const N=[[156,124,236],[126,92,220],[84,52,176],[58,30,140]];
    const D_base = isThu ? [[220,140,120], [200,80,60], [170,50,40], [140,30,20]   // 红暖（百廿校庆）
    ] : [
  [177,123,221], [138,60,192], [106,34,158], [85,24,131]   // 紫金（2班）
    ];
    const N_base = isThu ? [[200,100,80], [180,70,50], [150,50,40], [120,30,20]
    ] : [
  [156,124,236], [126,92,220], [84,52,176], [58,30,140]
    ];
    const body=ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    const ps2=[0,.32,.75,1];
    for(let k=0;k<4;k++){body.addColorStop(ps2[k], C3(D_base[k], N_base[k], t));}; //body.addColorStop(ps2[k],C3(D[k],N[k],t));
    ctx.fillStyle=body; ctx.fillRect(p.x,-12,PIPE_W,top+capH+12);
    ctx.fillStyle=body; ctx.fillRect(p.x,bot-12,PIPE_W,H-bot+12);
    paintCap(p.x-5,top,capH,t);
    paintCap(p.x-5,bot-capH,capH,t);
    // ★ 绘制年份（仅在百廿校庆挑战模式）
    if (isThu && p.year !== null && p.year >= 1906 && p.year <= 2026) {
      ctx.save();
      const yStr = String(p.year);
      const fs = 22;
      ctx.font = 'bold ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      const tw = ctx.measureText(yStr).width;
      const bx = p.x + PIPE_W/2 - tw/2 - 12;
      const by2 = p.cy - fs/2 - 12;
      const bw = tw + 24, bh = fs + 20;
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      rr(bx, by2, bw, bh, 10);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 2;
      rr(bx, by2, bw, bh, 10);
      ctx.stroke();
      ctx.fillStyle = '#FFD700';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 8;
      ctx.font = 'bold ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(yStr, p.x + PIPE_W/2, p.cy + 2);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,215,0,0.7)';
      ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('年', p.x + PIPE_W/2 + tw/2 + 14, p.cy + 2);
      ctx.restore();
    }
    // 在 drawPipes 的循环内，paintCap 调用之后，接缝之前插入
    if (!isThu && p.dateData !== null) { // 2班模式有日期
      ctx.save();
      const dateStr = p.dateData;
      const fs = 20; // 字号稍小
      ctx.font = 'bold ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      const tw = ctx.measureText(dateStr).width;
      const bx = p.x + PIPE_W/2 - tw/2 - 10;
      const by2 = p.cy - fs/2 - 10;
      const bw = tw + 20, bh = fs + 20;
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(200,80,60,0.6)'; // 半透明红暖底色
      rr(bx, by2, bw, bh, 8);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#FF6B6B';
      ctx.lineWidth = 2;
      rr(bx, by2, bw, bh, 8);
      ctx.stroke();
      ctx.fillStyle = '#FFF8E7';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(dateStr, p.x + PIPE_W/2, p.cy + 1);
      ctx.restore();
    }
    // 接缝(白天金 / 夜晚青), 分层"辉光"
    //const seam=C3([246,187,96],[150,240,255],t);
    const seamBase = isThu ? [255,200,100] : [246,187,96];
    const seam = C3(seamBase, [150,240,255], t);
    if(t>0.02){ ctx.globalAlpha=t*.25; ctx.fillStyle=seam;
      ctx.fillRect(p.x-8,top+capH-9,PIPE_W+16,9); ctx.fillRect(p.x-8,bot-6,PIPE_W+16,9); }
    ctx.globalAlpha=1;
    ctx.fillStyle=seam;
    ctx.fillRect(p.x-5,top+capH-5,PIPE_W+10,2.5);
    ctx.fillRect(p.x-5,bot-2.5,PIPE_W+10,2.5);
    // 左高光 / 右阴影
    ctx.fillStyle='rgba(255,255,255,'+(0.18+0.17*t).toFixed(3)+')';
    ctx.fillRect(p.x+8,0,6,Math.max(0,top+capH));
    ctx.fillRect(p.x+8,bot-capH,6,GROUND_Y-bot+capH);
    ctx.fillStyle=C4([40,8,70,.28],[6,3,32,.45],t);
    ctx.fillRect(p.x+PIPE_W-9,0,9,Math.max(0,top+capH));
    ctx.fillRect(p.x+PIPE_W-9,bot-capH,9,GROUND_Y-bot+capH);
  }
}
function paintCap(x,y,capH,t){
  const isThu = (mode === 'thu');
  //const D=[[212,172,238],[174,103,221],[124,45,180]];
  //const N=[[244,234,255],[204,170,250],[128,80,214]];
  const D = isThu ? [[240,180,160], [220,130,100], [190,80,60]] : [[212,172,238], [174,103,221], [124,45,180]];
  const N = isThu ? [[230,180,160], [210,140,110], [180,100,80]] : [[244,234,255], [204,170,250], [128,80,214]];
  const cg=ctx.createLinearGradient(0,y,0,y+capH);
  const ps3=[0,.3,1];
  for(let k=0;k<3;k++) cg.addColorStop(ps3[k],C3(D[k],N[k],t));
  rr(x,y,PIPE_W+10,capH,9);
  ctx.fillStyle=cg; ctx.fill();
  // 双层描边 = 廉价霓虹边
  ctx.lineJoin='round';
  //ctx.strokeStyle=C4([64,16,100,.35],[140,190,255,.45],t);
  //ctx.lineWidth=6; rr(x,y,PIPE_W+10,capH,9); ctx.stroke();
  //ctx.strokeStyle=C4([64,16,100,.6],[228,220,255,.95],t);
  //ctx.lineWidth=2; rr(x,y,PIPE_W+10,capH,9); ctx.stroke();
  const stroke1 = isThu ? [160,60,40] : [64,16,100];
  const stroke2 = isThu ? [200,140,120] : [140,190,255];
  ctx.strokeStyle = C4(stroke1, [140,190,255,.45], t);
  ctx.lineWidth=6; rr(x,y,PIPE_W+10,capH,9); ctx.stroke();
  ctx.strokeStyle = C4(stroke2, [228,220,255,.95], t);
  ctx.lineWidth=2; rr(x,y,PIPE_W+10,capH,9); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.30)'; rr(x+6,y+4,PIPE_W-8,capH*.3,4); ctx.fill();
}

/* --- 地面 --- */
function drawGround(){
  const t=nightAmt, gy=GROUND_Y;
  //const D=[[109,49,159],[79,31,120],[46,17,73]];
  //const N=[[56,46,106],[34,27,74],[13,10,38]];
  const isThu = (mode === 'thu');
  const D = isThu ? [
    [180, 70, 50],   // 红暖系
    [150, 50, 40],
    [120, 30, 20]
  ] : [
    [109, 49, 159],  // 紫金系（原配色）
    [79, 31, 120],
    [46, 17, 73]
  ];
  const N = isThu ? [
    [150, 50, 40],
    [120, 30, 20],
    [90, 20, 10]
  ] : [
    [56, 46, 106],
    [34, 27, 74],
    [13, 10, 38]
  ];
  const g=ctx.createLinearGradient(0,gy,0,H);
  const ps4=[0,.28,1];
  for(let k=0;k<3;k++) g.addColorStop(ps4[k],C3(D[k],N[k],t));
  ctx.fillStyle=g; ctx.fillRect(0,gy,W,GROUND_H);
  //ctx.fillStyle=C3([138,76,192],[74,63,134],t);
  const dotDay = isThu ? [200,100,80] : [138,76,192];
  const dotNight = isThu ? [150,70,50] : [74,63,134];
  ctx.fillStyle = C3(dotDay, dotNight, t);
  for(let x=-4;x<W+10;x+=18){
    ctx.beginPath(); ctx.arc(x,gy+2,9,Math.PI,0); ctx.fill();
  }
  ctx.fillStyle=C3([246,227,168],[255,215,110],t); ctx.fillRect(0,gy-1,W,3);
  ctx.fillStyle='rgba(255,215,110,'+(0.65+0.05*t).toFixed(3)+')'; ctx.fillRect(0,gy+2,W,1.5);
  ctx.fillStyle='rgba(255,255,255,'+(0.045-0.015*t).toFixed(3)+')';
  const off=-(groundX%52);
  for(let x=off;x<W;x+=52) ctx.fillRect(x,gy+16,26,GROUND_H-16);
  ctx.fillStyle='rgba(0,0,0,.10)';
  ctx.fillRect(0,gy+22,W,2); ctx.fillRect(0,gy+58,W,2);
  //ctx.fillStyle=C4([246,187,96,.30],[255,215,110,.16],t);
  const decoDay = isThu ? [255,200,100] : [246,187,96];
  const decoNight = isThu ? [255,180,80] : [255,215,110];
  ctx.fillStyle = C4(decoDay, decoNight, t);
  [[31,38],[67,52],[143,42],[196,60],[258,36],[321,55],[382,44]].forEach(function(d){
    const xx=d[0]+Math.round(groundX*0.6)%13; ctx.fillRect(xx,gy+d[1],2.5,2.5);
  });
}

/* --- 校徽(球): 夜间更亮 --- */
function drawLogo(cx,cy,r,rot,nA,avatarOn){
  const glowUp = vy<0? Math.min(1,-vy/900):0;
  const halo = (nA*.62+glowUp*.4);
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot||0);
  if(halo>0.03){
    const gg=ctx.createRadialGradient(0,0,r*.35,0,0,r*2.0);
    gg.addColorStop(0,'rgba(255,'+(200+nA*55)+',140,'+(halo*.9)+')');
    gg.addColorStop(1,'rgba(255,214,120,0)');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,r*2.1,0,7); ctx.fill();
  }
  ctx.save(); ctx.translate(3,6); ctx.globalAlpha=.28;
  ctx.beginPath(); ctx.arc(0,0,r*1.16,0,7); ctx.fillStyle='#140a24'; ctx.fill(); ctx.restore();
  // 底环(夜间提亮)
  ctx.beginPath(); ctx.arc(0,0,r*1.12,0,7);
  const ring = nA>0.5 ? 'rgba(255,224,138,.99)' : '#e5b24a';
  ctx.fillStyle='rgba(255,255,255,'+(0.97-0.06*nA)+')'; ctx.fill();
  ctx.lineWidth=Math.max(2.2,r*.1); ctx.strokeStyle=ring; ctx.stroke();
  if(nA>0.5){ ctx.lineWidth=1; ctx.strokeStyle='rgba(255,245,220,.95)'; ctx.stroke(); }
  const img = avatarOn ? ballImage() : logo;
  
  if(img.complete&&img.naturalWidth>0){
    const d = img===avatar ? r*2.10 : r*2.16;   // 头像球贴纸全幅圆形
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r*1.05,0,7); ctx.clip();
    ctx.drawImage(img,-d/2,-d/2,d,d);
    if(img===logo && avatarOn && nA>0.4){ ctx.globalAlpha=(nA-0.4)*.5; ctx.fillStyle='#ffe9c0';
      ctx.beginPath(); ctx.arc(0,0,r*.9,0,7); ctx.fill(); ctx.globalAlpha=1; }
    ctx.restore();
  }
  //无头像时的后备方案
  else{
    ctx.beginPath(); ctx.arc(0,0,r*.96,0,7);
    ctx.fillStyle='#920783'; ctx.fill();
    ctx.fillStyle='#F6BB60'; ctx.font='700 '+(r*.5)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('宁夏银川一中',0,-r*.1);
  }
  ctx.restore();
}
function drawBird(){ drawLogo(BX,birdY+bob,R_BIRD,angle,nightAmt,mode==='xinya'); }
function drawParticles(){
  parts.forEach(function(p){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawHUD(){
  if(state!=='menu'){
    const line = nightAmt>0.5?'rgba(30,20,90,.95)':'rgba(70,18,115,.92)';
    outlineText(String(score),W/2,40,56,'#ffffff',line,'center',true);
  }
  ctx.fillStyle='rgba(255,255,255,.7)';
  rr(muteRect.x,muteRect.y,muteRect.w,muteRect.h,11); ctx.fill();
  ctx.strokeStyle='rgba(90,26,140,.25)'; ctx.lineWidth=1.5; rr(muteRect.x,muteRect.y,muteRect.w,muteRect.h,11); ctx.stroke();
  ctx.fillStyle='#4a176e'; ctx.font='600 19px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(muted?'🔇':'🔊',muteRect.x+muteRect.w/2,muteRect.y+muteRect.h/2+1);
  // 绘制暂停按钮（仅在游戏中显示）
  if (state === 'play') {
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    rr(pauseRect.x, pauseRect.y, pauseRect.w, pauseRect.h, 11);
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,26,140,.25)';
    ctx.lineWidth = 1.5;
    rr(pauseRect.x, pauseRect.y, pauseRect.w, pauseRect.h, 11);
    ctx.stroke();
    ctx.fillStyle = '#4a176e';
    ctx.font = '600 19px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(paused ? '▶' : '⏸', pauseRect.x + pauseRect.w/2, pauseRect.y + pauseRect.h/2 + 1);
  }
  if(flash>0&&state!=='over'){
    ctx.globalAlpha=Math.min(1,flash); outlineText('+1',BX+44,birdY-52,30,'#F6BB60','rgba(70,18,115,.85)'); ctx.globalAlpha=1;
  }
}

  card(cardXy,true,'2班来时路','2026届2班 · 回顾在一中的日子',bestXy,

  // 玩法提示

  text('昼夜更替 · 走过在一中的日子 · 共赏星空 & 夜里的银川一中',W/2,394,11.5,'rgba(90,26,140,.6)');
  text('云开雾散, 一路到天亮都可以飞 ~',W/2,420,10.5,'rgba(90,26,140,.42)');

  // ========== 🎵 音乐选择器 ==========
  const sY = BGM_BAR_Y;   // 与 bgmButtonRect() 共用同一个 Y 坐标
  // 画一个浅色背景条
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  rr(W/2 - 160, sY - 8, 321, 40, 20); ctx.fill();
  // 左边标签
  ctx.fillStyle = '#5b1f8f';
  ctx.font = '500 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('🎵 音乐', W/2 - 150, sY + 12);

  // 循环绘制 3 个音乐按钮
  for(let i = 0; i < bgmTracks.length && i < bgmNames.length; i++) {
    const r = bgmButtonRect(i);
    const isActive = (i === selectedBgmIndex);
    // 按钮背景（选中为紫色，未选中为灰色）
    ctx.fillStyle = isActive ? '#a53fd0' : 'rgba(200,200,200,0.6)';
    rr(r.x, r.y, r.w, r.h, 13); ctx.fill();
    // 按钮文字（选中为白色，未选中为深灰）
    ctx.fillStyle = isActive ? '#ffffff' : '#444';
    ctx.font = (isActive ? '700' : '500') + ' 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(bgmNames[i], r.x + r.w/2, r.y + r.h/2 + 1);

  // 站点那首「夜空中最亮的星」在小游戏里选不到：三首都灰着，这里说明现在放的是哪首
  if (selectedBgmIndex < 0) {
    ctx.fillStyle = 'rgba(90,26,140,.55)';

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('正在播放：夜空中最亮的星', W/2, sY + 42);

  if(deadT>0.45){

    const ny=newBest?36:0;
    const ph=newBest?282:246;

    ctx.strokeStyle='rgba(246,187,96,.75)'; ctx.lineWidth=2.5; rr(W/2-156,128,312,ph,26); ctx.stroke();
  if(newBest){
      ctx.fillStyle='#F6BB60'; rr(W/2-88,146,176,32,16); ctx.fill();

function drawVictory(){

  // 简单起见，可先显示文字
  ctx.fillStyle = 'rgba(0,0,0,0.3)';

  drawParticles();

//绘制通知文字（支持多行，用 \n 分隔）
function drawWords(){
  if(state!=='play' || !notification) return;

  // 去掉空行, 避免提示文字被顶偏
  const lines=notification.text.split('\n').filter(function(s){ return s.trim()!==''; });
  if(!lines.length) return;

  const lineHeight=36, padX=30, padY=18;
  const maxWidth=W-80, cx=W/2, boxTop=100;
  const baseSize=26;

  ctx.font='bold '+baseSize+'px "PingFang SC","Microsoft YaHei",sans-serif';
  let maxLineWidth=0;
  lines.forEach(function(l){ maxLineWidth=Math.max(maxLineWidth, ctx.measureText(l).width); });
  // 一行太长就等比缩小字号, 保证文字始终在框内
  const fontSize=Math.min(baseSize, baseSize*(maxWidth-2*padX)/Math.max(1,maxLineWidth));
  const bw=Math.min(maxLineWidth*(fontSize/baseSize)+padX*2, maxWidth);
  const bh=lines.length*lineHeight+padY*2;
  const bx=cx-bw/2;

  ctx.globalAlpha=Math.min(1, notification.timer*1.5);
  ctx.fillStyle='rgba(0,0,0,0.5)'; rr(bx,boxTop,bw,bh,20); ctx.fill();
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=2; rr(bx,boxTop,bw,bh,20); ctx.stroke();

  // 每行都居中排在这个框里（旧版把文字画到了框外）
  ctx.fillStyle='#FFE66D';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold '+fontSize.toFixed(1)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  lines.forEach(function(l,i){ ctx.fillText(l, cx, boxTop+padY+lineHeight/2+i*lineHeight); });
  ctx.globalAlpha=1;
}
//绘制暂停状态
function drawStop(){
if (state === 'play' && paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 40px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⏸ 暂停中', W/2, H/2);
  }
}
//绘制2班结束语
function drawTrans(){
  if (xinyaTransition) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
    const lines = XINYA_TRANSITION_MSG.split('\n');
    const lineHeight = 40;          // 行高（像素）
    const startY = H/2 - (lines.length-1) * lineHeight / 2;
    lines.forEach((line, i) => {
      ctx.fillText(line, W/2, startY + i * lineHeight);
    });
    return;   // 跳过后续所有绘制
  }
}


/* ---------- 主绘制: 单一场景, 颜色按 nightAmt 连续渐变 ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  drawTrans();
  if (xinyaTransition) {return;}   // 直接返回，不绘制后续任何内容
  drawSky();                       // 含星/月/远山(按夜色淡入)
  drawBackGround();                // 背景图片(透明度淡入)
  drawClouds();
  if(state!=='menu') drawPipes();
  drawParticles();
  if(state!=='menu') drawBird();
  drawGround();
  drawHUD();
  drawStop()
  drawWords();
  if(state==='menu') drawMenu();
  if(state==='over') drawOver();
  if(state === 'victory') drawVictory();
}

/* ---------- 自测钩子 ---------- */
window.__THU={ get:function(){return {state:state,birdY:birdY,vy:vy,score:score,fatigue:1,pipes:pipes.length,p0x:pipes.length?Math.round(pipes[0].x):-999,groundY:GROUND_Y,best:best,night:night,nA:Math.round(nightAmt*100)/100,mode:mode,nb:newBest,angle:Math.round(angle*100)/100,music:(bgm.src.split('/').pop()||''),musicOn:!bgm.paused,musicPick:selectedBgmIndex,musicPos:Math.round((bgm.currentTime||0)*10)/10};} };

requestAnimationFrame(function(now){ last=now; requestAnimationFrame(frame); });
})();
